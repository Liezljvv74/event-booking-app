# Builds the static export and publishes it to GitHub Pages.
#
# Pages is switched on for this repository with Settings → Pages → Build and
# deployment → Source set to "GitHub Actions", so this workflow is what
# publishes the site. It was on "Deploy from a branch" before, which handed
# the repository root to Jekyll and served the README as the home page
# instead of the app.
#
# The subdirectory the site is served from is read from configure-pages
# rather than written down here, so renaming the repository does not break
# links. Deploying this way runs no Jekyll.
name: Deploy to GitHub Pages

# Every push to main publishes, so what is on the branch is what is on the
# site. It can still be run by hand from the Actions tab, which is how to
# re-publish without a commit to make.
on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# One deploy at a time, and never cancel one halfway: a partial upload would
# leave the published site in pieces.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - id: pages
        uses: actions/configure-pages@v5

      - run: npm ci

      - name: Build the static export
        run: npm run build
        env:
          # "/event-booking-app" for a project page; empty for a user page.
          NEXT_PUBLIC_BASE_PATH: ${{ steps.pages.outputs.base_path }}

      - uses: actions/upload-pages-artifact@v3
        with:
          path: ./out

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
